<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planning Insights</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🔍 Planning Insights</h1>
    <p class="subtitle">Enter a GitHub username and repository to explore planning insights.</p>

    <form id="insightsForm">
      <div class="form-group">
        <label for="username">GitHub Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="e.g. octocat"
          required
          autocomplete="off"
        />
      </div>

      <div class="form-group">
        <label for="repo">Repository Name or URL</label>
        <input
          type="text"
          id="repo"
          name="repo"
          placeholder="e.g. my-repo or https://github.com/user/repo"
          required
          autocomplete="off"
        />
      </div>

      <button type="submit" id="submitBtn">Get Insights</button>
    </form>

    <div id="error" class="error hidden"></div>
    <div id="results" class="results hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
